
services:
  postgres:
    image: postgres:15
    restart: always
    container_name: package_server
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:  
      - packagenet

  adminer:
    image: adminer:latest
    restart: always
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: package_server
    depends_on:
      - postgres
    networks: 
      - packagenet

volumes:
  postgres_data:

networks: 
  packagenet:
    driver: bridge   