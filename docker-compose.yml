
services:
  postgres:
    image: postgres:15
    restart: always
    container_name: package_server
    environment:
      POSTGRES_USER: package_posgres
      POSTGRES_PASSWORD: package_secure
      POSTGRES_DB: package_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U package_posgres -d package_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - packagenet

  adminer:
    image: adminer:latest
    restart: always
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: package_server
      ADMINER_DEFAULT_DB: package_db
    depends_on:
      - postgres
    networks:
      - packagenet

  package-service-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: package-service-app
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/package_db
      - SPRING_DATASOURCE_USERNAME=package_posgres
      - SPRING_DATASOURCE_PASSWORD=package_secure
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - packagenet

volumes:
  postgres_data:

networks:
  packagenet:
    name: packagenet
    driver: bridge
    external: true 