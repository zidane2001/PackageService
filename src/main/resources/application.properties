spring.application.name=package-service
server.port=8080
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/package_db}
spring.datasource.username=${DATABASE_USERNAME:package_posgres}
spring.datasource.password=${DATABASE_PASSWORD:package_secure}
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.json
spring.liquibase.clear-checksums=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
eureka.client.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
